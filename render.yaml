# Render blueprint for the backend (free plan). Deploys are triggered by the GitHub pipeline,
# not by Render itself, so tests and database updates always run first.
services:
  - type: web
    name: pharmacy-world-api-development
    runtime: python
    plan: free
    region: frankfurt
    rootDir: backend
    autoDeploy: false
    buildCommand: pip install poetry && poetry config virtualenvs.in-project true && poetry install --only main --no-root
    startCommand: poetry run uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://malakabdelwahab-ds.github.io,http://localhost:3000
