[project]
name = "pharmacy-world-api"
version = "0.1.0"
description = "Pharmacy World API: medicines, alternatives, browsing and the AI assistant"
requires-python = ">=3.11"
dependencies = [
    "fastapi (>=0.115)",
    "uvicorn[standard] (>=0.30)",
    "psycopg[binary] (>=3.2)",
    "pandas (>=2.2)",
    "openpyxl (>=3.1)",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
httpx = ">=0.27"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
