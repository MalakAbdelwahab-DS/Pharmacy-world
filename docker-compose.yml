# Local database: PostgreSQL 16 with pgvector (for the AI assistant later)
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: pharmacy
      POSTGRES_PASSWORD: pharmacy
      POSTGRES_DB: pharmacy
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db:/docker-entrypoint-initdb.d:ro
volumes:
  pgdata:
