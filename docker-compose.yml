# Local database: PostgreSQL 16 with pgvector (for the AI assistant later).
# Tables are created by backend/scripts/migrate.py, the same way as in the pipeline.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: pharmacy
      POSTGRES_PASSWORD: pharmacy
      POSTGRES_DB: pharmacy
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
