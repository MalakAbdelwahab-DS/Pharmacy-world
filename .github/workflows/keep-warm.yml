# Keeps the free Render backend (and the Neon database) awake, so the site never has a
# 30-60 second "waking up" delay. GitHub may run scheduled jobs a few minutes late.
name: Keep backend awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    environment: development
    timeout-minutes: 3
    steps:
      - name: Ping the API (health check and one search, which also wakes the database)
        run: |
          curl --silent --show-error --max-time 90 "${{ vars.API_URL }}/health"
          curl --silent --show-error --max-time 60 -o /dev/null "${{ vars.API_URL }}/medicines/search?q=adol"
